spring:
  application:
    name: omni
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/omni
    username: OmniAdmin
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 10102

logging:
  level:
    org.springframework.web: DEBUG

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html            # Swagger UI 접속 경로 지정
    tags-sorter: alpha                # 컨트롤러 태그 정렬 기준 (알파벳순)
    operations-sorter: alpha          # API 메서드 정렬 기준
  api-docs:
    path: /v3/api-docs                # OpenAPI 스펙(JSON) 파일이 생성되는 경로